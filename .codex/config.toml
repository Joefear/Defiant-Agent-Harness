[mcp_servers.defiant_filesystem]
command = "cmd.exe"
args = [
  "/d",
  "/s",
  "/c",
  "scripts\\defiant_mcp.cmd",
  "--workdir",
  ".dah-codex-mcp",
  "--workspace-root",
  "examples/vscode_agent/workspace",
  "--user",
  "codex-operator",
  "--workspace",
  "codex-mcp-proof",
  "mcp-proxy",
  "--config",
  "examples/filesystem/mcp-proxy.yaml",
  "--runner",
  "codex-mcp",
  "--",
  "cmd",
  "/d",
  "/s",
  "/c",
  "npx",
  "-y",
  "@modelcontextprotocol/server-filesystem@2026.7.10",
  "examples/vscode_agent/workspace",
]
cwd = "."
env = { PYTHONPATH = "src", PYTHONUTF8 = "1", NPM_CONFIG_CACHE = ".npm-cache" }
required = true
startup_timeout_sec = 30
tool_timeout_sec = 60
default_tools_approval_mode = "auto"
