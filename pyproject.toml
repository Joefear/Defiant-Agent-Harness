[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defiant-agent-harness"
version = "0.12.0"
description = "Control, approvals, budgets, memory discipline, and audit evidence for business-grade AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=44.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff==0.15.17",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
dah = "defiant_agent_harness.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
defiant_agent_harness = ["policy/rules/*.yaml", "command/ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
